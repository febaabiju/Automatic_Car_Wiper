; PlatformIO Project Configuration File
; Automatic Car Wiper - ESP32 IoT Project

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor configuration
monitor_speed = 115200

; Upload configuration
upload_speed = 921600

; External library dependencies managed automatically by PlatformIO
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.6

; Helpful serial monitor filters
monitor_filters =
    esp32_exception_decoder
    default


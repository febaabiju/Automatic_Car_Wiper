; PlatformIO Project Configuration File
; Automatic Car Wiper - ESP32 IoT Project

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor configuration
monitor_speed = 115200

; Upload configuration
upload_speed = 460800

; Partition scheme: Huge App (3MB Flash for firmware, 1MB SPIFFS)
board_build.partitions = huge_app.csv

; External library dependencies managed automatically by PlatformIO
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.6
    tzapu/WiFiManager @ ^2.0.17

; Helpful serial monitor filters
monitor_filters =
    esp32_exception_decoder
    default

